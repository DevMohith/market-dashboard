
services:
  mongo:
    image: mongo
    container_name: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  neo4j:
    image: neo4j:5.12
    container_name: neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/Neo4j123
    volumes:
      - neo4j_data:/data

  fastapi:
    build:
      context: ./services/graph-service/data_ingestion
    container_name: fastapi-app
    ports:
      - "8000:8000"
    depends_on:
      - mongo
      - neo4j
    environment:
      - MONGO_URI=mongodb://mongo:27017
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASS=Neo4j123

volumes:
  mongo_data:
  neo4j_data:
