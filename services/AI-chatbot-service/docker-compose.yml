version: '3.8'

services:


  chatbot-app:
    build:
      context: ./app
    container_name: mohith-chatbot
    env_file:
      - ./app/.env
    depends_on:
      - redis
      - qdrant
    networks:
      - mohith-network
    ports:
      - "8008:8008"
    volumes:
      - ./app:/app
    

  redis:
    image: redis
    container_name: mohith-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - mohith-network


  qdrant:
    image: qdrant/qdrant
    container_name: mohith-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - mohith-network

networks:
  mohith-network:

volumes:
  qdrant_data:
  redis_data: